<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Issue Certificate | CampusClub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(99,102,241,.16),
                    transparent 35%
                ),
                #080b14;

            color: #f8fafc;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .page {

            max-width: 900px;

            margin: auto;

            padding: 45px 25px;
        }

        .top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;
        }

        .brand {

            font-size: 27px;

            font-weight: 800;
        }

        .brand span {
            color: #818cf8;
        }

        .back {

            color: #cbd5e1;

            text-decoration: none;

            border: 1px solid #293349;

            padding: 10px 16px;

            border-radius: 10px;
        }

        .card {

            background:
                linear-gradient(
                    145deg,
                    rgba(20,26,42,.96),
                    rgba(12,16,28,.96)
                );

            border: 1px solid #273044;

            border-radius: 22px;

            padding: 32px;
        }

        h1 {

            font-size: 34px;

            font-weight: 800;

            margin-bottom: 7px;
        }

        .subtitle {

            color: #94a3b8;

            margin-bottom: 28px;
        }

        label {

            color: #cbd5e1;

            font-weight: 600;

            margin-bottom: 7px;
        }

        .form-control,
        .form-select {

            background: #0b1020;

            border: 1px solid #293349;

            color: white;

            border-radius: 11px;

            padding: 12px;
        }

        .form-control:focus,
        .form-select:focus {

            background: #0b1020;

            color: white;

            border-color: #6366f1;

            box-shadow: none;
        }

        option {

            background: #0b1020;

            color: white;
        }

        .error {

            background:
                rgba(239,68,68,.10);

            border:
                1px solid
                rgba(239,68,68,.25);

            color: #fca5a5;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 20px;
        }

        .btn-main {

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            border: none;

            color: white;

            border-radius: 11px;

            padding: 13px 22px;

            font-weight: 700;
        }

    </style>

</head>


<body>

<div class="page">


    <div class="top">

        <div class="brand">
            Campus<span>Club</span>
        </div>

        <a
            href="{{ url_for('dashboard') }}"
            class="back"
        >
            ← Dashboard
        </a>

    </div>


    <div class="card">

        <h1>
            Issue Certificate
        </h1>

        <div class="subtitle">
            Generate a verified certificate for a student.
        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
        >

            <div class="row g-4">


                <!-- STUDENT -->

                <div class="col-12">

                    <label>
                        Student
                    </label>

                    <select
                        name="student_id"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Student
                        </option>

                        {% for student in students %}

                        <option
                            value="{{ student['id'] }}"
                        >

                            {{ student["name"] }}

                            {% if student["ra_number"] %}
                                — {{ student["ra_number"] }}
                            {% endif %}

                            — {{ student["email"] }}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- EVENT -->

                <div class="col-12">

                    <label>
                        Event
                    </label>

                    <select
                        name="event_id"
                        class="form-select"
                    >

                        <option value="">
                            No Event / General Certificate
                        </option>

                        {% for event in events %}

                        <option
                            value="{{ event['id'] }}"
                        >

                            {{ event["title"] }}

                            —

                            {{ event["event_date"] }}

                            {% if event["club_name"] %}

                                —
                                {{ event["club_name"] }}

                            {% endif %}

                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- TYPE -->

                <div class="col-md-4">

                    <label>
                        Certificate Type
                    </label>

                    <select
                        name="certificate_type"
                        class="form-select"
                    >

                        <option value="Participation">
                            Participation
                        </option>

                        <option value="Achievement">
                            Achievement
                        </option>

                        <option value="Winner">
                            Winner
                        </option>

                        <option value="Completion">
                            Completion
                        </option>

                        <option value="Appreciation">
                            Appreciation
                        </option>

                    </select>

                </div>


                <!-- TITLE -->

                <div class="col-md-8">

                    <label>
                        Certificate Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        placeholder="e.g. Certificate of Participation"
                        maxlength="200"
                        required
                    >

                </div>


                <!-- SUBMIT -->

                <div class="col-12">

                    <button
                        type="submit"
                        class="btn-main"
                    >
                        Issue Certificate
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>

</body>

</html>
